<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader 1 NEWS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-family: sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Breaking news animation */
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 25s linear infinite;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="bg-white border-b-2 border-slate-300 relative shadow-sm">
        <!-- Language Switcher (Top Right Absolute) -->
        <div class="absolute top-3 right-3 sm:right-6 flex space-x-1 border border-slate-800 p-1 bg-white rounded shadow-sm z-10">
            <button onclick="changeLanguage('si')" class="bg-blue-700 text-white font-bold text-xs px-2.5 py-1 rounded hover:bg-blue-800">සිංහල</button>
            <button onclick="changeLanguage('ta')" class="bg-blue-600 text-white font-bold text-xs px-2.5 py-1 rounded hover:bg-blue-700">தமிழ்</button>
            <button onclick="changeLanguage('en')" class="bg-blue-600 text-white font-bold text-xs px-2.5 py-1 rounded hover:bg-blue-700">English</button>
        </div>

        <div class="container mx-auto px-4 pt-6 pb-4 flex flex-col md:flex-row items-center justify-between">
            <!-- Social Media Icons (Left) -->
            <div class="flex items-center space-x-3 text-slate-800 text-xl mb-4 md:mb-0">
                <a href="#" class="hover:text-blue-600"><i class="fa-solid fa-bolt"></i></a>
                <a href="#" class="hover:text-blue-600"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" class="hover:text-blue-400"><i class="fa-brands fa-twitter"></i></a>
                <a href="#" class="hover:text-red-600"><i class="fa-brands fa-youtube"></i></a>
                <a href="#" class="hover:text-pink-600"><i class="fa-brands fa-instagram"></i></a>
            </div>

            <!-- Main Logo (Center) -->
            <div class="flex items-center justify-center my-2 md:my-0">
                <span class="text-4xl md:text-5xl font-extrabold tracking-tight text-slate-900">Reader</span>
                <span class="bg-[#b91c1c] text-white text-3xl md:text-4xl font-bold rounded-full w-12 h-12 md:w-14 md:h-14 flex items-center justify-center mx-2 shadow-inner">1</span>
                <span class="text-4xl md:text-5xl font-extrabold tracking-tight text-slate-900">NEWS</span>
            </div>

            <!-- Empty div for desktop alignment balance -->
            <div class="hidden md:block w-32"></div>
        </div>
    </header>

    <!-- Navigation Bar / Categories -->
    <nav class="bg-white border-y-2 border-slate-300 shadow-sm sticky top-0 z-30">
        <div class="container mx-auto flex items-center overflow-x-auto no-scrollbar font-bold text-slate-800 text-sm md:text-base">
            <button onclick="filterCategory('politics')" class="px-5 py-2.5 border-r border-slate-300 hover:bg-slate-100 whitespace-nowrap">දේශපාලන</button>
            <button onclick="filterCategory('sports')" class="px-5 py-2.5 border-r border-slate-300 hover:bg-slate-100 whitespace-nowrap">ක්‍රීඩා</button>
            <button onclick="filterCategory('education')" class="px-5 py-2.5 border-r border-slate-300 hover:bg-slate-100 whitespace-nowrap">අධ්‍යාපන</button>
            <button onclick="filterCategory('world')" class="px-5 py-2.5 border-r border-slate-300 hover:bg-slate-100 whitespace-nowrap">විදේශ</button>
            <button onclick="filterCategory('business')" class="px-5 py-2.5 border-r border-slate-300 hover:bg-slate-100 whitespace-nowrap">ව්‍යාපාර</button>
            <button onclick="filterCategory('health')" class="px-5 py-2.5 border-r border-slate-300 hover:bg-slate-100 whitespace-nowrap">සෞඛ්‍ය</button>
            <button onclick="filterCategory('all')" class="px-5 py-2.5 border-r border-slate-300 hover:bg-slate-100 whitespace-nowrap">සම්බන්ධ වන්න</button>
        </div>
    </nav>

    <!-- Breaking News Ticker Bar -->
    <div class="bg-black text-white border-b-2 border-slate-900 overflow-hidden py-1.5 px-4 flex items-center">
        <div class="overflow-hidden w-full text-xs md:text-sm font-semibold tracking-wide">
            <div id="ticker-text" class="animate-marquee space-x-8">
                <span>🔥 ශිෂ්‍යත්ව විභාගය අනිද්දා: මුළු අයදුම්කරුවන් 294,089ක්</span>
                <span class="text-red-500">◀◀</span>
                <span>මෝදි සහ හොංකොං අගමැති අතර දුරකථන සංවාදයක්</span>
                <span class="text-red-500">◀◀</span>
                <span>සවුදි අරාබිය, තුර්කිය සහ පාකිස්තානය අතර සාකච්ඡා ආරම්භ වේ</span>
            </div>
        </div>
    </div>

    <!-- Main Content Container (Grid Layout) -->
    <main class="container mx-auto p-4 md:p-6">
        
        <!-- News Cards Grid (3 Columns) -->
        <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading Skeletons -->
            <div class="bg-white border-2 border-slate-300 rounded p-4 h-64 animate-pulse"></div>
            <div class="bg-white border-2 border-slate-300 rounded p-4 h-64 animate-pulse"></div>
            <div class="bg-white border-2 border-slate-300 rounded p-4 h-64 animate-pulse"></div>
            <div class="bg-white border-2 border-slate-300 rounded p-4 h-64 animate-pulse"></div>
            <div class="bg-white border-2 border-slate-300 rounded p-4 h-64 animate-pulse"></div>
            <div class="bg-white border-2 border-slate-300 rounded p-4 h-64 animate-pulse"></div>
            <div class="bg-white border-2 border-slate-300 rounded p-4 h-64 animate-pulse"></div>
            <div class="bg-white border-2 border-slate-300 rounded p-4 h-64 animate-pulse"></div>
            <div class="bg-white border-2 border-slate-300 rounded p-4 h-64 animate-pulse"></div>
        </div>

    </main>

    <!-- Quick Read Modal -->
    <div id="newsModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-lg p-6 shadow-2xl border border-slate-300 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-3 right-3 bg-red-600 hover:bg-red-500 text-white text-xs px-3 py-1 rounded font-bold">✕ වසන්න</button>
            <img id="modalImage" src="" alt="News Image" class="w-full h-64 object-cover rounded-md mt-4 hidden">
            <h3 id="modalTitle" class="text-xl font-bold text-slate-900 mt-4 mb-2 leading-snug"></h3>
            <p id="modalBody" class="text-slate-700 text-sm leading-relaxed my-4"></p>
        </div>
    </div>

    <!-- Live RSS Script -->
    <script>
        const rssFeeds = {
            si: [
                { name: "Ada Derana", url: "https://sinhala.adaderana.lk/rss.php" },
                { name: "Hiru News", url: "https://www.hirunews.lk/rss/sinhala.xml" },
                { name: "BBC Sinhala", url: "https://www.bbc.com/sinhala/index.xml" }
            ],
            en: [
                { name: "Ada Derana English", url: "http://www.adaderana.lk/rss.php" },
                { name: "Daily Mirror", url: "https://www.dailymirror.lk/RSS_Feeds/breaking-news" }
            ],
            ta: [
                { name: "Virakesari", url: "https://www.virakesari.lk/feed" }
            ]
        };

        let activeNewsList = [];
        let currentFilter = 'all';

        async function fetchLiveNews(lang = 'si') {
            const grid = document.getElementById('news-grid');
            activeNewsList = [];

            const selectedFeeds = rssFeeds[lang] || rssFeeds['si'];

            for (let feed of selectedFeeds) {
                try {
                    const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`);
                    const data = await response.json();

                    if (data.status === 'ok' && data.items) {
                        data.items.forEach(item => {
                            let imgUrl = item.thumbnail || (item.enclosure && item.enclosure.link) || '';
                            
                            if (!imgUrl && item.description) {
                                const imgMatch = item.description.match(/<img[^>]+src="([^">]+)"/);
                                if (imgMatch) imgUrl = imgMatch[1];
                            }

                            let cleanDesc = item.description ? item.description.replace(/<[^>]*>?/gm, '').trim() : 'විස්තර සහිත පුවත කියවන්න.';

                            activeNewsList.push({
                                title: item.title,
                                pubDate: new Date(item.pubDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                                image: imgUrl || 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=800&q=80',
                                description: cleanDesc
                            });
                        });
                    }
                } catch (e) {
                    console.error("RSS Fetch Error: ", e);
                }
            }

            renderNews();
        }

        function filterCategory(catKey) {
            currentFilter = catKey;
            renderNews();
        }

        function renderNews() {
            const grid = document.getElementById('news-grid');
            grid.innerHTML = '';

            let filteredList = activeNewsList;

            if (currentFilter !== 'all') {
                filteredList = activeNewsList.filter(news => {
                    const text = (news.title + " " + news.description).toLowerCase();
                    if (currentFilter === 'politics') return text.includes('දේශපාලන') || text.includes('මංත්‍රී') || text.includes('අමාත්‍ය') || text.includes('parliament');
                    if (currentFilter === 'sports') return text.includes('ක්‍රිකට්') || text.includes('ක්‍රීඩා') || text.includes('cricket');
                    if (currentFilter === 'education') return text.includes('පාසල්') || text.includes('විභාග') || text.includes('අධ්‍යාපන');
                    if (currentFilter === 'world') return text.includes('ලෝක') || text.includes('විදේශ') || text.includes('world');
                    if (currentFilter === 'business') return text.includes('මුදල්') || text.includes('ව්‍යාපාර') || text.includes('බැංකු');
                    if (currentFilter === 'health') return text.includes('සෞඛ්‍ය') || text.includes('රෝහල') || text.includes('වෛද්‍ය');
                    return true;
                });
            }

            if (filteredList.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-12 border-2 border-slate-300 rounded bg-white">මේ මොහොතේ මෙම අංශයට අදාළ පුවත් නොමැත.</p>`;
                return;
            }

            filteredList.forEach((news, idx) => {
                grid.innerHTML += `
                    <div class="bg-white border-2 border-slate-300 rounded p-3 hover:shadow-lg transition cursor-pointer flex flex-col justify-between" onclick="openNewsModal(${idx})">
                        <div>
                            <img src="${news.image}" alt="News Image" class="w-full h-48 object-cover rounded mb-3" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=800&q=80'">
                            <h3 class="font-bold text-slate-900 text-base hover:text-blue-600 line-clamp-3 leading-snug">${news.title}</h3>
                        </div>
                        <div class="text-right text-xs text-slate-500 font-semibold mt-3 pt-2 border-t border-slate-200">
                            ${news.pubDate}
                        </div>
                    </div>
                `;
            });
        }

        function changeLanguage(lang) {
            fetchLiveNews(lang);
        }

        function openNewsModal(index) {
            const item = activeNewsList[index];
            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalBody').innerText = item.description;

            const modalImg = document.getElementById('modalImage');
            if (item.image) {
                modalImg.src = item.image;
                modalImg.classList.remove('hidden');
            } else {
                modalImg.classList.add('hidden');
            }

            document.getElementById('newsModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('newsModal').classList.add('hidden');
        }

        // Auto load on start
        fetchLiveNews('si');
    </script>
</body>
</html>
